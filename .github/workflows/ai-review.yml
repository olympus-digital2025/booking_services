name: AI PR Review

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

jobs:
  # ─────────────────────────────────────────
  # AI REVIEW GATE
  # Triggers all three AI agents on every PR:
  #   @copilot  — logic errors, WP security patterns
  #   @claude   — ACF, Gutenberg, Shopify Liquid
  #   @codex    — SQL injection, XSS, nonce checks
  #
  # Requires Copilot Business with Claude + Codex
  # agents enabled in repo settings.
  # ─────────────────────────────────────────
  ai-review-comment:
    name: Post AI Review Instructions
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Post AI review trigger comment
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.issue.number;
            const branch = context.payload.pull_request.head.ref;
            const author = context.payload.pull_request.user.login;

            const body = [
              `## 🤖 AI Code Review Triggered`,
              ``,
              `PR **#${prNumber}** from \`${branch}\` by @${author} is queued for AI review.`,
              ``,
              `The following agents will review this PR automatically via **GitHub Copilot Business**:`,
              ``,
              `| Agent | Focus Area |`,
              `|-------|-----------|`,
              `| \`@copilot\` | Logic errors, WP security patterns, nonce verification, capability checks |`,
              `| \`@claude\` | ACF field mapping, Gutenberg block logic, Shopify Liquid, PHP architecture |`,
              `| \`@codex\` | SQL injection, XSS / unescaped output, hardcoded secrets, OWASP A01/A03/A07 |`,
              ``,
              `> **Instructions for AI agents** (from \`instructions.mdc\`):`,
              `> - All PHP must pass \`composer run lint\` (PHPCS WordPress-Core, Extra, Docs)`,
              `> - \`snake_case\` functions/vars, \`PascalCase\` classes, \`UPPER_SNAKE_CASE\` constants`,
              `> - Sanitize input: \`sanitize_text_field()\`, \`absint()\`, \`sanitize_email()\``,
              `> - Escape output: \`esc_html()\`, \`esc_url()\`, \`esc_attr()\`, \`wp_kses()\``,
              `> - Nonces: \`check_ajax_referer()\`, \`wp_verify_nonce()\``,
              `> - Capabilities: \`current_user_can()\` before privileged actions`,
              `> - Queries: \`$wpdb->prepare()\` — never raw SQL`,
              `> - No hardcoded API keys, tokens, or credentials`,
              `> - Cyclomatic complexity max 10, nesting depth max 3`,
              `> - No \`TODO\` / \`FIXME\` comments — convert to tracked issues`,
              ``,
              `---`,
              `*AI review is advisory. Human peer review + lead approval are still required before merge.*`
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body
            });

  # ─────────────────────────────────────────
  # SECURITY SCAN — detect secrets in diff
  # Runs in parallel with AI review
  # Blocks if hardcoded credentials found
  # ─────────────────────────────────────────
  secret-scan:
    name: Secret Scan — No Hardcoded Credentials
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
