name: CI Pipeline

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────
  # JOB 1 — LINT
  # Runs PHPCS with WordPress Coding Standards
  # Rules defined in phpcs.xml
  # NOTE: continue-on-error: true — lint reports
  # violations but does NOT block the pipeline
  # while existing errors are being resolved.
  # Set to false once codebase is clean.
  # ─────────────────────────────────────────
  lint:
    name: Lint — PHPCS WordPress Standards
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Run PHPCS (WordPress Coding Standards)
        run: composer run lint

  # ─────────────────────────────────────────
  # JOB 2 — SONARCLOUD ANALYSIS
  # Hosted on sonarcloud.io — no SONAR_HOST_URL needed
  # Requires secrets:
  #   SONAR_TOKEN — from SonarCloud project settings
  # sonar-project.properties in repo root handles
  # all project config (key, org, exclusions, etc.)
  # Runs independently — does not need lint to pass
  # ─────────────────────────────────────────
  sonarcloud:
    name: SonarCloud — Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Full history required for new-code detection
          # and accurate blame analysis
          fetch-depth: 0

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ─────────────────────────────────────────
  # JOB 4 — DEPLOY TO STAGING
  # Fires only on develop branch after gate passes
  # SSH rsync to staging subdomain
  # Requires secrets: STAGING_SSH_HOST, STAGING_SSH_USER,
  #   STAGING_SSH_KEY, STAGING_PATH
  # ─────────────────────────────────────────
  deploy-staging:
    name: Deploy — Staging (SiteGround)
    runs-on: ubuntu-latest
    needs: sonarcloud
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: Install production dependencies only
        # --no-dev excludes phpcs, phpunit etc from the deployed bundle
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev

      - name: Setup SSH for SiteGround
        # SiteGround uses non-standard SSH port 18765
        # ssh-keyscan must specify the port explicitly
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p 18765 -H ${{ secrets.STAGING_SSH_HOST }} >> ~/.ssh/known_hosts
          # Write SSH config so rsync uses the right port automatically
          cat >> ~/.ssh/config << EOF
          Host ${{ secrets.STAGING_SSH_HOST }}
            HostName ${{ secrets.STAGING_SSH_HOST }}
            User ${{ secrets.STAGING_SSH_USER }}
            Port 18765
            IdentityFile ~/.ssh/id_rsa
            StrictHostKeyChecking no
          EOF

      - name: Deploy via rsync to staging
        run: |
          rsync -avz --delete \
            -e "ssh -p 18765 -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no" \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='tests' \
            --exclude='.env*' \
            --exclude='*.xml' \
            --exclude='*.lock' \
            --exclude='composer.lock' \
            ./ ${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_SSH_HOST }}:${{ secrets.STAGING_PATH }}

      - name: Verify deploy on staging
        # Confirm the plugin file landed on the server correctly
        run: |
          ssh -p 18765 -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=no \
            ${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_SSH_HOST }} \
            "ls -la ${{ secrets.STAGING_PATH }}/functions.php && echo 'Deploy verified.'"

      - name: Post staging URL to PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ **Staging Deploy Complete**\n\n🔗 Staging URL: ${{ secrets.STAGING_URL }}\n\nPlease verify your changes before approving merge to `main`.'
            })

  deploy-production:
    name: Deploy — Production (SiteGround)
    runs-on: ubuntu-latest
    needs: sonarcloud
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: Install production dependencies only
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev

      - name: Setup SSH for SiteGround
        # SiteGround uses non-standard SSH port 18765
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p 18765 -H ${{ secrets.PROD_SSH_HOST }} >> ~/.ssh/known_hosts
          cat >> ~/.ssh/config << EOF
          Host ${{ secrets.PROD_SSH_HOST }}
            HostName ${{ secrets.PROD_SSH_HOST }}
            User ${{ secrets.PROD_SSH_USER }}
            Port 18765
            IdentityFile ~/.ssh/id_rsa
            StrictHostKeyChecking no
          EOF

      - name: Deploy via rsync to production
        run: |
          rsync -avz --delete \
            -e "ssh -p 18765 -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no" \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='tests' \
            --exclude='.env*' \
            --exclude='*.xml' \
            --exclude='*.lock' \
            --exclude='composer.lock' \
            ./ ${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }}:${{ secrets.PROD_PATH }}

      - name: Verify deploy on production
        run: |
          ssh -p 18765 -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=no \
            ${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }} \
            "ls -la ${{ secrets.PROD_PATH }}/functions.php && echo 'Deploy verified.'"

      - name: Extract version from functions.php
        id: get_version
        run: |
          VERSION=$(grep -oP "(?<=Version: )[\d.]+" functions.php)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create git tag for release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ steps.get_version.outputs.version }}" \
            -m "Release v${{ steps.get_version.outputs.version }}"
          git push origin "v${{ steps.get_version.outputs.version }}"

      - name: Create GitHub Release
        uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ steps.get_version.outputs.version }}';
            github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `v${version}`,
              name: `v${version}`,
              body: [
                '## Features\n',
                '## Bug Fixes\n',
                '## Performance\n',
                '## Breaking Changes\n',
                `**Full Changelog**: https://github.com/${context.repo.owner}/${context.repo.repo}/compare/...v${version}`
              ].join('\n'),
              draft: true,
              prerelease: false
            })
