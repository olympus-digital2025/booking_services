# ─────────────────────────────────────────
# SonarCloud Project Configuration
# Platform: sonarcloud.io
# Organization: olympus-digital2025
# Project: booking_services
# ─────────────────────────────────────────

sonar.organization=olympus-digital2025
sonar.projectKey=olympus-digital2025_booking_services
sonar.projectName=booking_services
sonar.projectVersion=1.0

# ─────────────────────────────────────────
# SOURCES AND EXCLUSIONS
# Mirrors phpcs.xml exclude-pattern entries
# ─────────────────────────────────────────
sonar.sources=.
sonar.exclusions=\
  vendor/**,\
  build/**,\
  scripts/**,\
  node_modules/**,\
  tests/**,\
  assets/js/**,\
  assets/css/**,\
  *.lock

# ─────────────────────────────────────────
# LANGUAGE
# ─────────────────────────────────────────
sonar.language=php
sonar.php.file.suffixes=.php

# ─────────────────────────────────────────
# COVERAGE
# Commented out — no PHPUnit tests yet
# Uncomment once tests are writing coverage.xml
# ─────────────────────────────────────────
# sonar.php.coverage.reportPaths=coverage.xml
# sonar.php.tests.reportPath=test-results.xml

# ─────────────────────────────────────────
# COMPLEXITY — matches phpcs.xml rule #22
# ─────────────────────────────────────────
sonar.php.complexity.threshold=10

# ─────────────────────────────────────────
# NEW CODE POLICY
# Quality Gate applies only to changed lines
# relative to main — legacy code won't block PRs
# ─────────────────────────────────────────
sonar.newCode.referenceBranch=main

# ─────────────────────────────────────────
# SCM
# fetch-depth: 0 is set in ci.yml for this reason
# ─────────────────────────────────────────
sonar.scm.provider=git
sonar.sourceEncoding=UTF-8