# ─────────────────────────────────────────
# SonarQube Project Configuration
# Matched to phpcs.xml rules and custom-plugin structure
# Project: MBNDEV/custom-plugin
# ─────────────────────────────────────────

sonar.projectKey=olympus-digital2025_booking_services
sonar.organization=olympus-digital2025

# This is the name and version displayed in the SonarCloud UI.
sonar.projectName=booking_services
sonar.projectVersion=1.0

# ─────────────────────────────────────────
# SOURCE AND EXCLUSIONS
# Mirrors phpcs.xml exclude-pattern entries:
#   vendor/*, build/*, scripts/*
# ─────────────────────────────────────────
sonar.sources=.
sonar.exclusions=\
  vendor/**,\
  build/**,\
  scripts/**,\
  node_modules/**,\
  tests/**,\
  *.lock,\
  *.xml

sonar.tests=tests
sonar.test.inclusions=tests/**/*Test.php,tests/**/*.test.js

# ─────────────────────────────────────────
# LANGUAGE
# ─────────────────────────────────────────
sonar.language=php
sonar.php.file.suffixes=.php

# ─────────────────────────────────────────
# COVERAGE REPORTS
# Generated by PHPUnit with --coverage-clover
# Path matches GitHub Actions artifact output
# ─────────────────────────────────────────
sonar.php.coverage.reportPaths=coverage.xml
sonar.php.tests.reportPath=test-results.xml

# ─────────────────────────────────────────
# QUALITY GATE THRESHOLDS
# Aligned with standardization plan:
#   Bugs = 0 (new code)
#   Vulnerabilities = 0
#   Coverage >= 80%
#   Cyclomatic CC <= 10 (matches phpcs.xml rule #22)
#   Duplication flagged
# These are enforced via SonarQube server Quality Gate.
# The settings below configure analysis behavior.
# ─────────────────────────────────────────

# Cyclomatic complexity threshold — matches phpcs.xml #22
sonar.php.complexity.threshold=10

# Cognitive complexity threshold
sonar.php.cognitiveComplexity.threshold=15

# Coverage minimum — enforced in Quality Gate on server
# Set here for reference: 80%
# sonar.coverage.exclusions mirrors phpcs.xml exclude-pattern
sonar.coverage.exclusions=\
  vendor/**,\
  build/**,\
  scripts/**,\
  tests/**

# ─────────────────────────────────────────
# SECURITY — OWASP / SANS CATEGORIES
# Aligned with SECURITY.md enforced sniffs:
#   WordPress.Security.EscapeOutput
#   WordPress.Security.ValidatedSanitizedInput
#   WordPress.Security.NonceVerification
#   WordPress.DB.PreparedSQL
#   WordPress.DB.PreparedSQLPlaceholders
#   WordPress.DB.DirectDatabaseQuery
# SonarQube PHP security rules that map to these:
# ─────────────────────────────────────────

# Enable OWASP Top 10 security hotspot categories
sonar.security.hotspot.inheritFromParent=false

# New code definition — analyze only changed code on PRs
# This aligns with the gate: "Bugs = 0 on NEW code"
sonar.newCode.referenceBranch=main

# ─────────────────────────────────────────
# ENCODING
# ─────────────────────────────────────────
sonar.sourceEncoding=UTF-8

# ─────────────────────────────────────────
# SCM
# Needed for blame information and new-code detection
# fetch-depth: 0 is set in GitHub Actions for this reason
# ─────────────────────────────────────────
sonar.scm.provider=git
